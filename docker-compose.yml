services:
  postgres:
    image: postgres:16-alpine
    container_name: study-time-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: study
      POSTGRES_PASSWORD: study
      POSTGRES_DB: study_time
    volumes:
      - study_time_pg:/var/lib/postgresql/data

volumes:
  study_time_pg:
